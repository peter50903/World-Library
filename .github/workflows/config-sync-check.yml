name: 設定檔文字副本同步檢查

# 確認 config/sheets/ 的每分頁 CSV 與正式 Excel 一致，並把逐格差異印在記錄中。
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: config-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    name: 設定檔同步檢查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 openpyxl
        run: pip install openpyxl==3.1.5
      - name: 檢查 config/sheets/ 是否與 Excel 同步
        run: python3 tools/config_export.py --check
      - name: 跨表引用檢查（自我測試）
        run: python3 tools/config_refcheck.py --selftest
      - name: 跨表引用檢查（00E 路由不得指向已刪除分頁或欄位）
        run: python3 tools/config_refcheck.py
      - name: TEMP 盤點（自我測試）
        run: python3 tools/temp_inventory.py --selftest
      - name: TEMP 盤點（docs/TEMP_待裁決清單.md 須列出所有含 TEMP 的程式檔）
        run: python3 tools/temp_inventory.py --check
