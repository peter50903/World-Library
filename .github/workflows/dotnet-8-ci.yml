name: .NET 8 environment and project CI

# CI does not call Claude. It only checks the .NET SDK and any future solution.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET 8 SDK and build verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify toolchain using temporary C# project
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          temp_dir="$(mktemp -d)"
          dotnet new classlib --framework net8.0 --name ToolchainSmoke --output "$temp_dir/ToolchainSmoke" --no-restore
          dotnet restore "$temp_dir/ToolchainSmoke/ToolchainSmoke.csproj"
          dotnet build "$temp_dir/ToolchainSmoke/ToolchainSmoke.csproj" --no-restore --configuration Release
          echo "SDK smoke passed; this does NOT validate game code."

      - name: Build and test actual solution when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f WorldSimulation.sln ]]; then
            dotnet restore WorldSimulation.sln
            dotnet build WorldSimulation.sln --no-restore --configuration Release
            dotnet test WorldSimulation.sln --no-build --configuration Release --logger "console;verbosity=normal"
            # V0-01: exercise an actual interactive Observer CLI, not just unit tests.
            printf 'n\ns\nh\nq\n' | dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 | tee /tmp/observer-demo-smoke.log
            grep -q '已處理事件' /tmp/observer-demo-smoke.log
            grep -q '歷史（共' /tmp/observer-demo-smoke.log
            grep -q '第 1 日' /tmp/observer-demo-smoke.log
            # V0-07C: TEMP save slots in the text observer — save slot 2 on day 9, advance, load slot 2.
            export WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)"
            printf '9\nsave 2\nn\nload 2\nslots\nload 3\nsave 4\nq\n' | dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 | tee /tmp/observer-slots.log
            grep -q '已儲存到 TEMP 存檔槽 2：槽 2：第 9 日｜種子 42｜一般示範｜存檔第 2 版' /tmp/observer-slots.log
            grep -q '已讀取 TEMP 存檔槽 2。' /tmp/observer-slots.log
            grep -q '世界狀態｜種子 42｜第 9 日' /tmp/observer-slots.log
            grep -q '槽 3：（空）' /tmp/observer-slots.log
            grep -q '讀檔失敗，現在的世界沒有改變：存檔槽 3 是空的。' /tmp/observer-slots.log
            grep -q '存檔槽必須是 1～3' /tmp/observer-slots.log
            unset WORLD_SIM_TEMP_SAVE_DIR
            # V0-05: actually run the headless 100-year command once and check its output.
            dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 --years 100 | tee /tmp/observer-century.log
            grep -q '第 100 年（至第 36400 日）' /tmp/observer-century.log
            grep -q '長測完成：種子 42，100 年' /tmp/observer-century.log
            grep -q '守恆錯誤 0，' /tmp/observer-century.log
            # V0-06B: the TEMP frontier scenario (migrants may found settlements) must also run 100 years cleanly.
            dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 --years 100 --frontier | tee /tmp/observer-frontier.log
            grep -q '長測完成：種子 42，100 年' /tmp/observer-frontier.log
            grep -q '守恆錯誤 0，' /tmp/observer-frontier.log
          else
            echo "WorldSimulation.sln not present yet. Skipping game build and tests."
          fi

      - name: Restore and compile actual Godot observer C# project (V0-02)
        shell: bash
        run: |
          set -euo pipefail
          # Compiles against the real Godot.NET.Sdk, not merely a .NET smoke app.
          test -f godot/project.godot
          test -f godot/Scenes/Observer.tscn
          dotnet restore godot/WorldSimulation.Godot.csproj
          dotnet build godot/WorldSimulation.Godot.csproj --no-restore --configuration Release
          echo "Godot C# build succeeded. Interactive scene still needs Godot .NET editor to view."

      - name: Restore verified Godot 4.7.2 .NET engine archive from cache
        uses: actions/cache@v4
        with:
          path: /tmp/godot-dotnet.zip
          # Pinned to the official release asset content digest, NOT mutable URLs.
          key: godot-mono-linux-x86_64-4.7.2-sha256-129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247

      - name: Headless Godot 4.7.2 .NET project import and scene launch (V0-02)
        shell: bash
        run: |
          set -euo pipefail
          # Download the official matching .NET-enabled engine release, not plain Godot.
          url="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          # Download only if the digest-namespaced archive is not cached.
          if [[ ! -f /tmp/godot-dotnet.zip ]]; then
            curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$url" -o /tmp/godot-dotnet.zip
          else
            echo "Godot archive cache hit; checksum will still be verified."
          fi
          # Pinned to godotengine/godot 4.7.2-stable official Release asset 519690444 digest.
          # Verify BEFORE unzip or executing downloaded bytes. Never rely on the URL alone.
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  /tmp/godot-dotnet.zip" | sha256sum -c -
          mkdir -p /tmp/godot-dotnet
          unzip -q /tmp/godot-dotnet.zip -d /tmp/godot-dotnet
          engine="$(find /tmp/godot-dotnet -type f -name 'Godot*mono_linux*.x86_64' -print -quit)"
          test -n "$engine"
          chmod +x "$engine"

          # The Godot editor normally uses its Debug script build on first open.
          dotnet build godot/WorldSimulation.Godot.csproj --no-restore --configuration Debug
          timeout 90 "$engine" --headless --path godot --editor --import 2>&1 | tee /tmp/godot-import.log
          WORLD_SIM_UI_SMOKE=1 timeout 45 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-scene.log

          # Fail on Godot's own scene/script errors even if the process returns zero.
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-import.log /tmp/godot-scene.log; then
            echo "Godot reported an import or scene runtime error."
            exit 1
          fi
          grep -q 'Godot Engine' /tmp/godot-scene.log
          grep -q 'WORLD_SIM_UI_SMOKE_OK: Day=31 History=31' /tmp/godot-scene.log
          grep -Eq 'WORLD_SIM_WEEKLY_LEDGER_OK: Weeks=4 Settlements=[2-4]' /tmp/godot-scene.log
          grep -q 'WORLD_SIM_HEX_CLICK_OK: Col=2 Row=2' /tmp/godot-scene.log
          grep -Eq 'WORLD_SIM_SETTLEMENT_CLICK_OK: Settlements=[2-4] Id=1' /tmp/godot-scene.log
          # V0-04B: TEMP famine scenario — hunger and caused starvation events must appear
          # in the real Godot history list.
          WORLD_SIM_UI_SMOKE=1 WORLD_SIM_FAMINE_SMOKE=1 timeout 45 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-famine.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-famine.log; then
            echo "Godot reported a runtime error in the famine scenario."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_FAMINE_OK: HungerEvents=[1-9][0-9]* Deaths=[1-9][0-9]*' /tmp/godot-famine.log
          # V0-06A: TEMP local famine — starving people leave settlement #1 on foot; the real
          # Godot map must show the migrant batch and the history the caused emigration event.
          WORLD_SIM_MIGRATION_SMOKE=1 timeout 45 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-migration.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-migration.log; then
            echo "Godot reported a runtime error in the migration scenario."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_MIGRATION_OK: Day=[0-9]+ Batches=[1-9][0-9]* People=[1-9][0-9]* From=1 To=[2-4]' /tmp/godot-migration.log
          # V0-06B: TEMP frontier — migrants found a new settlement on an empty cell; the real Godot map
          # must show the new settlement, the history the caused founding event, and the cell panel its source.
          WORLD_SIM_SETTLE_SMOKE=1 timeout 60 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-settle.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-settle.log; then
            echo "Godot reported a runtime error in the settlement-founding scenario."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_SETTLE_OK: Seed=[0-9]+ Day=[0-9]+ Id=[3-9][0-9]* From=[1-4] Founders=[1-9][0-9]* Week=[1-9][0-9]*' /tmp/godot-settle.log
          # #64: real Godot _GuiInput wheel zoom, middle drag, hit-test after transform,
          # visible hex gap not selected, and unchanged Core world/RNG state.
          WORLD_SIM_MAP_INPUT_SMOKE=1 timeout 45 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-map-input.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-map-input.log; then
            echo "Godot reported a runtime error in the map input scenario."
            exit 1
          fi
          grep -q 'WORLD_SIM_MAP_INPUT_OK: Zoom=1.20 Pan=44 Day=0' /tmp/godot-map-input.log
          # V0-07: actual Godot buttons save, load and deterministic resume via TEMP JSON.
          # V0-07C: three TEMP slots — save slot 2, load it back, corrupt slot 3 rejected visibly.
          WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)" WORLD_SIM_SAVE_SMOKE=1 timeout 45 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-save.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-save.log; then
            echo "Godot reported a runtime error in TEMP save/load."
            exit 1
          fi
          grep -q 'WORLD_SIM_SAVE_OK: SavedDay=9 RestoredDay=9 ResumedDay=10' /tmp/godot-save.log
          grep -q 'WORLD_SIM_SLOTS_OK: Slot=2 SavedDay=9 RestoredDay=9 CorruptSlot=3 Rejected=1' /tmp/godot-save.log
          # V0-03B: Godot must render the injected Core map, never generate its own.
          if grep -Rq 'DemoHexWorld.Generate\|DemoWorldSites.Generate' godot/Scripts; then
            echo "Forbidden Godot-side map or site generation detected."
            exit 1
          fi
          # Terrain generation belongs to Core, never the Godot UI.
          if grep -Rq 'TerrainCode' godot/Scripts; then
            echo "Forbidden independent Godot terrain generator detected."
            exit 1
          fi
          grep -q 'RngStreams.Geography' src/WorldSimulation.Core/World/Demo/DemoHexWorld.cs
          echo "Actual Godot .NET scene loaded and ran headlessly."
