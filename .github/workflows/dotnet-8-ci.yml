name: .NET 8 environment and project CI

# CI does not call Claude. It only checks the .NET SDK and any future solution.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET 8 SDK and build verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify toolchain using temporary C# project
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          temp_dir="$(mktemp -d)"
          dotnet new classlib --framework net8.0 --name ToolchainSmoke --output "$temp_dir/ToolchainSmoke" --no-restore
          dotnet restore "$temp_dir/ToolchainSmoke/ToolchainSmoke.csproj"
          dotnet build "$temp_dir/ToolchainSmoke/ToolchainSmoke.csproj" --no-restore --configuration Release
          echo "SDK smoke passed; this does NOT validate game code."

      - name: Build and test actual solution when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f WorldSimulation.sln ]]; then
            dotnet restore WorldSimulation.sln
            dotnet build WorldSimulation.sln --no-restore --configuration Release
            # 第 08-1 章：普通世界人口診斷（只報告，以註記列出）。第 08-2 章：人口變多、長跑變慢，只診斷種子 1。
            for s in 1; do
              dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --diagnose-living --seed "$s" --years 60 > "/tmp/diag-$s.txt"
              grep -q '=== 普通世界人口診斷｜種子' "/tmp/diag-$s.txt"
              # 註記上限約 4 KB：切成多段（每段約 40 行）。
              split -l 40 -d "/tmp/diag-$s.txt" "/tmp/diag-$s-part-"
              for part in /tmp/diag-$s-part-*; do
                echo "::notice title=普通世界人口診斷 種子 $s $(basename "$part")::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$part")"
              done
            done
            # 測試輸出存檔：失敗時「最後一份日誌」註記步驟會列出失敗的測試與斷言（本工作階段讀不到原始日誌）。
            if ! dotnet test WorldSimulation.sln --no-build --configuration Release --logger "console;verbosity=normal" > /tmp/observer-tests.log 2>&1; then
              grep -nE '\[FAIL\]|Failed |Error Message|Assert\.|Expected|Actual' /tmp/observer-tests.log | head -80
              exit 1
            fi
            tail -5 /tmp/observer-tests.log
            # 第 04 章 b 節：100 年存檔讀檔與完整驗證耗時（以註記列出，供 PR 說明引用）。
            if [ -f /tmp/wsim-save-timing.txt ]; then echo "::notice title=100 年存檔耗時::$(cat /tmp/wsim-save-timing.txt)"; fi
            # V0-01: exercise an actual interactive Observer CLI, not just unit tests.
            printf 'n\ns\nh\n7\nh\nrng\nq\n' | dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 | tee /tmp/observer-demo-smoke.log
            grep -q '已處理事件' /tmp/observer-demo-smoke.log
            grep -q '歷史（共' /tmp/observer-demo-smoke.log
            grep -q '第 1 日' /tmp/observer-demo-smoke.log
            # C05：舊每日糧食線退役；推進／歷史改週結算摘要，rng 列出十條流計數器（執行期零抽樣）。
            grep -q '第 1 週結算（第 7 日）｜聚落人口' /tmp/observer-demo-smoke.log
            grep -q 'POP 提交前 0→提交後 0' /tmp/observer-demo-smoke.log
            grep -q 'RESOURCE 提交前 0→提交後 0' /tmp/observer-demo-smoke.log
            ! grep -q '收穫' /tmp/observer-demo-smoke.log
            ! grep -rnE 'RngStreams\.Resource|DemoDayEvent|MaxDailyHarvest|FoodPerPersonPerDay|DailyFood|DailyHistory' src godot/Scripts
            # 第 04 章 a 節：人口生死只走 POP 流；Core/Rng 以外不得有自製雜湊常數或另建亂數產生器。
            test -z "$(grep -rnE --include='*.cs' '0x9E3779B97F4A7C15|0xBF58476D1CE4E5B9|new Random|Random\.Shared' src godot/Scripts | grep -v 'src/WorldSimulation.Core/Rng/')"
            # 第 03 章 a 節（使用者裁決）：孤立預檢模組已刪除，程式與測試中這些型別名稱必須 0 筆（手冊與本檔除外）。
            ! git grep -nwE 'EntityRngCandidatePreflight|EntityRngResolutionCandidate|CommandGateway|CommandRequest|NormalizedCommand|EntityCandidatePreflight|EntityCreationDraft' -- ':!.github' ':!docs'
            # 提交暫存物件是唯一發布路徑：週報清單只在 DemoWorldCommit 與建立／讀檔安裝處被指派。
            test "$(grep -rn --include='*.cs' '_weeks = ' src/WorldSimulation.Core | grep -v 'DemoWorldCommit.cs' | grep -vc 'ImmutableList<DemoWeekReport>.Empty\|DemoObserverWorld.Snapshot.cs')" = "0"
            # 第 08 章 b 節：y 年報＝已提交週報彙整的年帳（與 --years 年報同格式）；進行中的年份標示。
            printf '400\ny\nq\n' | dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 | tee /tmp/observer-year.log
            grep -q '年報（共 2 年，資料＝已提交週報彙整）' /tmp/observer-year.log
            grep -q '  第 1 年（至第 365 日）｜週結算 52 次｜' /tmp/observer-year.log
            grep -q '  第 2 年（至第 400 日）｜週結算 5 次｜.*（進行中）' /tmp/observer-year.log
            dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 --years 1 | grep '^第 1 年' | sed 's/｜年末.*//' > /tmp/year-headless.txt
            grep '  第 1 年' /tmp/observer-year.log | sed 's/^  //' > /tmp/year-interactive.txt
            diff /tmp/year-headless.txt /tmp/year-interactive.txt
            # 第 03 章 b 節：ev N 印正式史庫事件（類型、地點、相關實體、原因邊＋根因、直接後果）；錯誤編號不改世界。
            printf '300\nev 1\nev abc\nev 999999\nq\n' | dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --frontier --seed 42 | tee /tmp/observer-history.log
            grep -q '事件 #1｜世界第 [0-9]* 日｜' /tmp/observer-history.log
            grep -q '  類型：' /tmp/observer-history.log
            grep -q '  地點：([0-9]*,[0-9]*)' /tmp/observer-history.log
            grep -q '  相關實體：#[0-9]' /tmp/observer-history.log
            grep -q '  原因邊：.*｜根因：' /tmp/observer-history.log
            grep -q '  直接後果：' /tmp/observer-history.log
            grep -q '用法：ev 事件編號' /tmp/observer-history.log
            grep -q '正式史庫沒有事件 #999999' /tmp/observer-history.log
            # AppendCommitted 只出現在史庫與提交物件（及測試）。
            test -z "$(grep -rln --include='*.cs' 'AppendCommitted' src godot | grep -v 'src/WorldSimulation.Core/History/EventHistory.cs' | grep -v 'src/WorldSimulation.Core/World/DemoWorldCommit.cs')"
            # 第 02 章 a 節：世界配方——啟動自訂歷史種子、已推進世界的 new 需 yes 確認、其他指令即取消、錯誤種子不改世界。
            printf 's\n3\nnew 5 6\nyes\ns\nn\nnew 9\nn\nnew abc\ns\nq\n' | dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 --history-seed 7 | tee /tmp/observer-recipe.log
            grep -q '世界配方｜世界種子 42｜歷史種子 7（自訂）｜規則版本 【TEMP】TEMP-RULES-0｜設定雜湊 [0-9a-f]\{16\}｜' /tmp/observer-recipe.log
            # 第 02 章 b 節：互動與無畫面模式都先印正式設定載入結果與設定雜湊；開場不再說「尚未載入正式設定」。
            grep -q '正式設定：01 已載入 [0-9]* 列｜29 已載入 [0-9]* 列（暫定' /tmp/observer-recipe.log
            ! grep -q '尚未載入試算表的正式世界設定' /tmp/observer-recipe.log
            grep -o '｜設定雜湊 [0-9a-f]\{16\}｜TEMP 設定雜湊' /tmp/observer-recipe.log | head -1 | grep -o '[0-9a-f]\{16\}' > /tmp/cli-hash16.txt
            test -s /tmp/cli-hash16.txt
            grep -q '目前世界已推進到第 3 日' /tmp/observer-recipe.log
            grep -q '世界配方｜世界種子 5｜歷史種子 6（自訂）' /tmp/observer-recipe.log
            grep -q '已取消建立新世界，目前世界未改變。' /tmp/observer-recipe.log
            grep -q '用法：new 世界種子 \[歷史種子\]' /tmp/observer-recipe.log
            test "$(grep -o '世界狀態｜種子 [0-9]*｜第 [0-9]* 日' /tmp/observer-recipe.log | tail -1)" = '世界狀態｜種子 5｜第 2 日'
            if dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 --history-seed 7 --years 1 > /tmp/observer-recipe-headless.log; then
              echo "--history-seed with --years must be rejected"; exit 1
            fi
            grep -q -- '--history-seed 只用於互動模式' /tmp/observer-recipe-headless.log
            # V0-07C: TEMP save slots in the text observer — save slot 2 on day 9, advance, load slot 2.
            export WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)"
            printf '{"Version":18,"State":' > "$WORLD_SIM_TEMP_SAVE_DIR/TEMP_slot_3.json" # corrupt slot 3
            printf '9\nsave 2\nn\nload 2\nslots\nload 3\ns\nload 1\nsave 4\nverify 2\nverify 1\nq\n' | dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 | tee /tmp/observer-slots.log
            grep -q '已儲存到 TEMP 存檔槽 2：槽 2：第 9 日｜世界種子 42｜歷史種子 [0-9]*（衍生）｜一般示範｜設定 [0-9a-f]\{8\}｜存檔第 18 版｜可讀' /tmp/observer-slots.log
            # 第 04 章 b 節：選用完整驗證。
            grep -q '完整驗證槽 2：一致（重跑耗時' /tmp/observer-slots.log
            grep -q '完整驗證槽 1：不一致——存檔槽 1 是空的' /tmp/observer-slots.log
            grep -q '已讀取 TEMP 存檔槽 2。' /tmp/observer-slots.log
            grep -q '世界狀態｜種子 42｜第 9 日' /tmp/observer-slots.log
            grep -q '槽 1：（空）' /tmp/observer-slots.log
            grep -q '槽 3：無法辨識（檔頭缺少世界資訊）' /tmp/observer-slots.log
            grep -q '讀檔失敗，現在的世界沒有改變：TEMP 存檔損毀' /tmp/observer-slots.log
            grep -q '讀檔失敗，現在的世界沒有改變：存檔槽 1 是空的。' /tmp/observer-slots.log
            grep -q '存檔槽必須是 1～3' /tmp/observer-slots.log
            # The failed loads above must not change the world: the last status line is still day 9.
            test "$(grep -o '世界狀態｜種子 42｜第 [0-9]* 日' /tmp/observer-slots.log | tail -1)" = '世界狀態｜種子 42｜第 9 日'
            # C04/C05: an older (v3, C04 format) save is refused with the single "too old" message, in the slot list and on load.
            printf '{"Version":3}' > "$WORLD_SIM_TEMP_SAVE_DIR/TEMP_slot_1.json"
            printf 'slots\nload 1\nq\n' | dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 | tee /tmp/observer-old-save.log
            grep -q '槽 1：無法辨識（版本太舊，請建立新世界（存檔第 3 版，目前第 18 版））' /tmp/observer-old-save.log
            grep -q '讀檔失敗，現在的世界沒有改變：版本太舊，請建立新世界' /tmp/observer-old-save.log
            unset WORLD_SIM_TEMP_SAVE_DIR
            # C08 §6 CLI: run exactly the card's one-year command; it must exit 0 and show the year-end date.
            dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 --years 1 > /tmp/observer-one-year.log
            cat /tmp/observer-one-year.log
            # Line 1 is the run title, line 2 the official-config line (第 02 章 b 節), line 3 the calendar.
            sed -n 2p /tmp/observer-one-year.log | grep -q '^正式設定：01 已載入'
            sed -n 3p /tmp/observer-one-year.log | grep -q 'WORLD_DAYS_PER_YEAR＝365'
            grep -q '｜年末 第 1 年 12 月 31 日' /tmp/observer-one-year.log
            # V0-05: actually run the headless 100-year command once and check its output.
            dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 --years 100 | tee /tmp/observer-century.log
            # #82: the year length comes from config/sheets/01_世界參數.csv WORLD_DAYS_PER_YEAR (365).
            grep -q 'WORLD_DAYS_PER_YEAR＝365' /tmp/observer-century.log
            grep -q '第 1 年（至第 365 日）｜週結算 52 次' /tmp/observer-century.log
            grep -q '第 2 年（至第 730 日）｜週結算 52 次' /tmp/observer-century.log
            grep -q '第 7 年（至第 2555 日）｜週結算 53 次' /tmp/observer-century.log
            grep -q '第 100 年（至第 36500 日）' /tmp/observer-century.log
            # C08: each yearly line ends with the year-end date from Core's calendar.
            grep -q '｜年末 第 1 年 12 月 31 日' /tmp/observer-century.log
            grep -q '｜年末 第 100 年 12 月 31 日' /tmp/observer-century.log
            grep -q 'WORLD_MONTH_DAYS' /tmp/observer-century.log
            grep -q '長測完成：種子 42，100 年（第 36500 日）' /tmp/observer-century.log
            grep -q '長測完成：種子 42，100 年' /tmp/observer-century.log
            grep -q '守恆錯誤 0，' /tmp/observer-century.log
            # #103: year-end per-settlement carrying evidence (TEMP estimate) for years 1/10/100, seeds 42/7/1.
            grep -q '第 100 年底各聚落承載（TEMP 估計' /tmp/observer-century.log
            grep -q '長期可養活' /tmp/observer-century.log
            grep -q '不變量 7 項全部通過' /tmp/observer-century.log
            # 第 08 章 c 節：長測執行器 --seeds——3 種子 × 100 年，每年年底檢查不變量註冊表（時間、ID、歷史、人口、資源、來源、遷徙）。
            dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seeds 42,7,1 --years 100 | tee /tmp/observer-longrun.log
            for s in 42 7 1; do
              grep -q "^--- 長測種子 $s ---" /tmp/observer-longrun.log
              grep -q "長測完成：種子 $s，100 年（第 36500 日）" /tmp/observer-longrun.log
            done
            test "$(grep -c '^不變量 7 項全部通過' /tmp/observer-longrun.log)" = 3
            test "$(grep -c '  TIME_MONOTONIC 時間單調 通過 100／100 次' /tmp/observer-longrun.log)" = 3
            test "$(grep -c '  MIGRATION_CONSERVATION 遷徙守恆 通過 100／100 次' /tmp/observer-longrun.log)" = 3
            test "$(grep -c '第 10 年底各聚落承載（TEMP 估計' /tmp/observer-longrun.log)" = 3
            grep -q '長測總結：3 種子 × 100 年全部通過（守恆錯誤 0、不變量 7 項全部通過）' /tmp/observer-longrun.log
            # 人類採集情境（出生、自然死亡、共享採集來源帳、家庭遷徙與建村）也跑 3 種子 × 100 年。
            living_rc=0
            dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seeds 42,7,5 --years 100 --living > /tmp/observer-longrun-living.log || living_rc=$?
            tail -20 /tmp/observer-longrun-living.log
            # 失敗時把守恆／不變量錯誤列成註記（API 可讀）。
            bad="$(grep -E '守恆錯誤：|長測中止|失敗 [0-9]+／' /tmp/observer-longrun-living.log | head -10 || true)"
            if [ -n "$bad" ]; then echo "::error title=人類採集長測錯誤::$(printf '%s' "$bad" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; fi
            test "$living_rc" = 0
            grep -q '長測總結：3 種子 × 100 年全部通過（守恆錯誤 0、不變量 7 項全部通過）' /tmp/observer-longrun-living.log
            test "$(grep -c '  SOURCE_LEDGER 來源帳 通過 100／100 次' /tmp/observer-longrun-living.log)" = 3
            if dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seeds 1,x --years 2 > /tmp/observer-longrun-bad.log; then
              echo "--seeds with a bad value must be rejected"; exit 1
            fi
            grep -q -- '--seeds <非負整數,非負整數' /tmp/observer-longrun-bad.log
            # V0-06B: the TEMP frontier scenario (migrants may found settlements) must also run 100 years cleanly.
            dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --demo --seed 42 --years 100 --frontier | tee /tmp/observer-frontier.log
            grep -q '長測完成：種子 42，100 年' /tmp/observer-frontier.log
            grep -q '守恆錯誤 0，' /tmp/observer-frontier.log
            # V0-08A (#74): table 45G M1 acceptance report — 3 TEMP seeds x 3 TEMP presets x 100 years.
            # A Hard failure exits 1 and fails this step (set -e + pipefail).
            # 第 08 章 d 節：正式驗收——3 種子 × 4 情境（加人類採集＝普通世界）＋普通世界種子 1～20 長期生存調查；報告寫檔供 artifact。
            dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --m1-check --years 100 --report /tmp/m1-report/M1驗收報告.txt | tee /tmp/observer-m1.log
            # 驗收結論以註記列出（API 可讀，供 PR 說明引用）。
            summary="$(sed -n '/=== M1 驗收總結/,$p' /tmp/observer-m1.log; grep '^  種子 [0-9]*｜人口 \|調查結果' /tmp/observer-m1.log)"
            echo "::notice title=M1 正式驗收::$(printf '%s' "$summary" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            # Every Enabled=TRUE CheckID from the CSV must be reported, in CSV order, in the summary.
            expected_ids="$(tail -n +2 'config/sheets/45G_M1驗收.csv' | tr -d '\r' | awk -F, '$NF=="TRUE"{print $1}')"
            test -n "$expected_ids"
            for id in $expected_ids; do grep -q "  $id｜" /tmp/observer-m1.log; done
            summary_ids="$(sed -n '/=== M1 驗收總結/,$p' /tmp/observer-m1.log | grep -o '^  M1_[A-Z_]*' | tr -d ' ')"
            test "$summary_ids" = "$expected_ids"
            test "$(grep -c '^--- 種子 ' /tmp/observer-m1.log)" = 12
            grep -q '沒有 Hard 項目失敗' /tmp/observer-m1.log
            test "$(grep -c '^  種子 [0-9]*｜人口 ' /tmp/observer-m1.log)" = 20
            grep -q '  調查結果：20 個種子中 [0-9]* 個活過 100 年' /tmp/observer-m1.log
            test "$(grep -c '^  必要項目 M1_[A-Z_]*｜通過（PASS）' /tmp/observer-m1.log)" = 8
            test "$(grep -c '^  案例｜.*｜找到｜' /tmp/observer-m1.log)" = 4
            grep -q '^正式驗收：通過' /tmp/observer-m1.log
            test -s /tmp/m1-report/M1驗收報告.txt
            # #82: --m1-check uses the same official year boundary as --demo --years.
            grep -q 'WORLD_DAYS_PER_YEAR＝365' /tmp/observer-m1.log
            # Bad arguments must fail loudly in Chinese, not be swallowed.
            if dotnet run --project src/WorldSimulation.ObserverCli --configuration Release --no-build -- --m1-check --years 0 > /tmp/observer-m1-bad.log; then
              echo "--m1-check --years 0 should fail."; exit 1
            fi
            grep -q '錯誤：--years 必須是' /tmp/observer-m1-bad.log
          else
            echo "WorldSimulation.sln not present yet. Skipping game build and tests."
          fi

      - name: Upload M1 acceptance report (第 08 章 d 節)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-acceptance-report
          path: /tmp/m1-report/
          if-no-files-found: ignore

      - name: Restore and compile actual Godot observer C# project (V0-02)
        shell: bash
        run: |
          set -euo pipefail
          # Compiles against the real Godot.NET.Sdk, not merely a .NET smoke app.
          test -f godot/project.godot
          test -f godot/Scenes/Observer.tscn
          dotnet restore godot/WorldSimulation.Godot.csproj
          dotnet build godot/WorldSimulation.Godot.csproj --no-restore --configuration Release
          echo "Godot C# build succeeded. Interactive scene still needs Godot .NET editor to view."

      - name: Restore verified Godot 4.7.2 .NET engine archive from cache
        uses: actions/cache@v4
        with:
          path: /tmp/godot-dotnet.zip
          # Pinned to the official release asset content digest, NOT mutable URLs.
          key: godot-mono-linux-x86_64-4.7.2-sha256-129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247

      - name: Headless Godot 4.7.2 .NET project import and scene launch (V0-02)
        shell: bash
        run: |
          set -euo pipefail
          # Download the official matching .NET-enabled engine release, not plain Godot.
          url="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          # Download only if the digest-namespaced archive is not cached.
          if [[ ! -f /tmp/godot-dotnet.zip ]]; then
            curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$url" -o /tmp/godot-dotnet.zip
          else
            echo "Godot archive cache hit; checksum will still be verified."
          fi
          # Pinned to godotengine/godot 4.7.2-stable official Release asset 519690444 digest.
          # Verify BEFORE unzip or executing downloaded bytes. Never rely on the URL alone.
          echo "129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247  /tmp/godot-dotnet.zip" | sha256sum -c -
          mkdir -p /tmp/godot-dotnet
          unzip -q /tmp/godot-dotnet.zip -d /tmp/godot-dotnet
          engine="$(find /tmp/godot-dotnet -type f -name 'Godot*mono_linux*.x86_64' -print -quit)"
          test -n "$engine"
          chmod +x "$engine"

          # The Godot editor normally uses its Debug script build on first open.
          dotnet build godot/WorldSimulation.Godot.csproj --no-restore --configuration Debug
          timeout 90 "$engine" --headless --path godot --editor --import 2>&1 | tee /tmp/godot-import.log
          WORLD_SIM_UI_SMOKE=1 timeout 45 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-scene.log

          # Fail on Godot's own scene/script errors even if the process returns zero.
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-import.log /tmp/godot-scene.log; then
            echo "Godot reported an import or scene runtime error."
            exit 1
          fi
          grep -q 'Godot Engine' /tmp/godot-scene.log
          grep -q 'WORLD_SIM_UI_SMOKE_OK: Day=31 Weeks=4' /tmp/godot-scene.log
          grep -Eq 'WORLD_SIM_WEEKLY_LEDGER_OK: Weeks=4 Settlements=[2-4]' /tmp/godot-scene.log
          # C08: status/ledger dates come from Core's calendar (01 sheet WORLD_MONTH_DAYS).
          grep -q 'WORLD_SIM_CALENDAR_OK: Day=31 Date=1-1-31 Week4=1-1-28' /tmp/godot-scene.log
          # 第 02 章 b 節：Godot 與 CLI 用同一份編入的正式設定，設定雜湊前 16 碼必須相同。
          grep -Eq 'WORLD_SIM_CONFIG_OK: Sheets=[0-9]+ Hash16=[0-9a-f]{16}' /tmp/godot-scene.log
          godot_hash="$(grep -o 'WORLD_SIM_CONFIG_OK: Sheets=[0-9]* Hash16=[0-9a-f]*' /tmp/godot-scene.log | sed 's/.*Hash16=//')"
          test "$godot_hash" = "$(cat /tmp/cli-hash16.txt)"
          grep -q 'WORLD_SIM_HEX_CLICK_OK: Col=2 Row=2' /tmp/godot-scene.log
          grep -Eq 'WORLD_SIM_SETTLEMENT_CLICK_OK: Settlements=[2-4] Id=1' /tmp/godot-scene.log
          # V0-04B: TEMP famine scenario — hunger and caused starvation events must appear
          # in the real Godot history list.
          WORLD_SIM_UI_SMOKE=1 WORLD_SIM_FAMINE_SMOKE=1 timeout 45 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-famine.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-famine.log; then
            echo "Godot reported a runtime error in the famine scenario."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_FAMINE_OK: HungerEvents=[1-9][0-9]* Deaths=[1-9][0-9]*' /tmp/godot-famine.log
          # V0-06A: TEMP local famine — starving people leave settlement #1 on foot; the real
          # Godot map must show the migrant batch and the history the caused emigration event.
          WORLD_SIM_MIGRATION_SMOKE=1 timeout 45 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-migration.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-migration.log; then
            echo "Godot reported a runtime error in the migration scenario."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_MIGRATION_OK: Day=[0-9]+ Batches=[1-9][0-9]* People=[1-9][0-9]* From=1 To=[2-4]' /tmp/godot-migration.log
          # V0-06B: TEMP frontier — migrants found a new settlement on an empty cell; the real Godot map
          # must show the new settlement, the history the caused founding event, and the cell panel its source.
          WORLD_SIM_SETTLE_SMOKE=1 timeout 60 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-settle.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-settle.log; then
            echo "Godot reported a runtime error in the settlement-founding scenario."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_SETTLE_OK: Seed=[0-9]+ Day=[0-9]+ Id=[1-9][0-9]* From=[1-4] Founders=[1-9][0-9]* Week=[1-9][0-9]*' /tmp/godot-settle.log
          # #64: real Godot _GuiInput wheel zoom, middle drag, hit-test after transform,
          # visible hex gap not selected, and unchanged Core world/RNG state.
          WORLD_SIM_MAP_INPUT_SMOKE=1 timeout 45 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-map-input.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-map-input.log; then
            echo "Godot reported a runtime error in the map input scenario."
            exit 1
          fi
          grep -q 'WORLD_SIM_MAP_INPUT_OK: Zoom=1.20 Pan=44 Day=0' /tmp/godot-map-input.log
          # V0-07: actual Godot buttons save, load and deterministic resume via TEMP JSON.
          # V0-07C: three TEMP slots — save slot 2, load it back, corrupt slot 3 rejected visibly.
          WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)" WORLD_SIM_SAVE_SMOKE=1 timeout 45 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-save.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-save.log; then
            echo "Godot reported a runtime error in TEMP save/load."
            exit 1
          fi
          grep -q 'WORLD_SIM_SAVE_OK: SavedDay=9 RestoredDay=9 ResumedDay=10' /tmp/godot-save.log
          grep -q 'WORLD_SIM_SLOTS_OK: Slot=2 SavedDay=9 RestoredDay=9 CorruptSlot=3 Rejected=1' /tmp/godot-save.log
          grep -q 'WORLD_SIM_SAVE_HEADER_OK: Compatible=1 ConfigMismatchRejected=1 ReplayVerified=1' /tmp/godot-save.log
          # #81: player-visible TEMP scenario picker — real picker/buttons, confirmation before discarding an
          # advanced world, fresh day-0 rebuild without residue, migration / founding / famine visible,
          # loading a slot restores its own scenario, and switching never touches the save slots.
          WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)" WORLD_SIM_SCENARIO_SMOKE=1 timeout 120 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-scenario.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-scenario.log; then
            echo "Godot reported a runtime error in the TEMP scenario switch smoke."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_SCENARIO_OK: Normal=42 LocalFamine=[0-9]+ MigrationDay=[1-9][0-9]* Frontier=[0-9]+ FoundedDay=[1-9][0-9]* Famine=42 ConfirmRequired=1 SlotsUnchanged=1' /tmp/godot-scenario.log
          # 第 02 章 a 節：世界／歷史種子輸入框——同配方重建、只換歷史種子地圖相同、錯誤輸入與未確認不改世界、存檔槽不動。
          WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)" WORLD_SIM_RECIPE_SMOKE=1 timeout 90 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-recipe.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-recipe.log; then
            echo "Godot reported a runtime error in the world recipe smoke."
            exit 1
          fi
          grep -q 'WORLD_SIM_RECIPE_OK: World=123 History=456 SameRecipe=1 HistoryOnlyMapSame=1 BadSeedRejected=1 ConfirmRequired=1 SlotsUnchanged=1' /tmp/godot-recipe.log
          # #89: event detail panel — real ItemList / Button signals walk founding ← emigration ← hunger
          # (43F CAUSE_PARENT) and back via EFFECT_CHILD; the map focus and cell panel follow each event.
          WORLD_SIM_EVENT_DETAIL_SMOKE=1 timeout 90 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-event-detail.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-event-detail.log; then
            echo "Godot reported a runtime error in the event detail smoke."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_EVENT_DETAIL_OK: Founded=#[1-9][0-9]* Emigration=#[1-9][0-9]* Hunger=#[1-9][0-9]* Cell=\([0-9]+,[0-9]+\) Type=TEMP_EV_SETTLEMENT_FOUNDED Edge=Direct' /tmp/godot-event-detail.log
          # #87: play / pause — real buttons and frames; paused never advances, playback equals Core day by day,
          # save / load auto-pause, and a long frame hitch is capped (TEMP).
          WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)" WORLD_SIM_PLAYBACK_SMOKE=1 timeout 60 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-playback.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-playback.log; then
            echo "Godot reported a runtime error in the play / pause smoke."
            exit 1
          fi
          grep -q 'WORLD_SIM_PLAYBACK_OK: Played=10 Paused=10 SaveAutoPaused=1 LoadAutoPaused=1 Capped=30' /tmp/godot-playback.log
          # #95: major-event alert — playback auto-pauses on the exact day Core records the first major event,
          # clicking the alert opens its detail and focuses the map, each event alerts once, a world switch clears it.
          WORLD_SIM_ALERT_SMOKE=1 timeout 120 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-alert.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-alert.log; then
            echo "Godot reported a runtime error in the major-event alert smoke."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_ALERT_OK: First=#[1-9][0-9]* Day=[1-9][0-9]* Second=#[0-9]+ Cell=\([0-9]+,[0-9]+\) Cleared=1' /tmp/godot-alert.log
          # #96: history search / filter — real OptionButton / SpinBox / LineEdit signals give exactly Core's
          # DemoEventFilter result, newest first and deterministic; empty result shown; clicking a result opens it;
          # filtering never changes the world; load and scenario switch reset the filter.
          WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)" WORLD_SIM_HISTORY_FILTER_SMOKE=1 timeout 120 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-history-filter.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-history-filter.log; then
            echo "Godot reported a runtime error in the history filter smoke."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_HISTORY_FILTER_OK: Kind=[1-9][0-9]* Settlement=[1-9][0-9]* Search=#[1-9][0-9]* Day=[1-9][0-9]* Empty=1 Deterministic=1 LoadReset=1 SwitchReset=1 CoreUnchanged=1' /tmp/godot-history-filter.log
          # #104: food supply / demand diagnostics — real map click + Next button on normal and local famine worlds,
          # days 0/7/35; every number equals Core's weekly ledger; viewing never changes the world; corrupt load
          # rejected with world and panel unchanged; a world switch leaves no previous settlement data.
          WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)" WORLD_SIM_FOOD_SMOKE=1 timeout 120 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-food.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-food.log; then
            echo "Godot reported a runtime error in the food diagnostics smoke."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_FOOD_OK: Weeks=4 FamineShortage=[1-9][0-9]* CoreUnchanged=1 CorruptRejected=1 SwitchReset=1' /tmp/godot-food.log
          # #113: new player-selectable foraging mode must survive actual Godot engine smoke.
          WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)" WORLD_SIM_FORAGING_SMOKE=1 timeout 90 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-foraging.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-foraging.log; then
            echo "Godot reported a runtime error in the foraging playable smoke."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_FORAGING_OK: Weeks=5 Harvest=[0-9]+ Forest20=1 River5=1 NoFreeFarm=1 SaveRoundTrip=1 CrowdedStarved=1 SourceLedger=1' /tmp/godot-foraging.log
          WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)" WORLD_SIM_HUD_SMOKE=1 timeout 90 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-hud.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-hud.log; then
            echo "Godot reported a runtime error in the observer HUD smoke."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_HUD_OK: TopBar=1 Time=1 Detail=1 Record=1 Keys=1 Resize=2 Art=29 Toolbar=1 MapMode=2 Modal=3 Outliner=[1-9][0-9]* Speeds=5' /tmp/godot-hud.log
          # 第 08 章 b 節：年度圖表——工具列開圖表、年帳＝無畫面年報、四組系列、真的滑鼠點年份、篩選該年事件、點事件定位地圖。
          WORLD_SIM_CHART_SMOKE=1 timeout 90 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-chart.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-chart.log; then
            echo "Godot reported a runtime error in the year chart smoke."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_CHART_OK: Years=3 Complete=2 CliEqual=1 Series=4 ClickYear=[1-3] Events=[1-9][0-9]* Focus=1 CoreUnchanged=1' /tmp/godot-chart.log
          WORLD_SIM_TEMP_SAVE_DIR="$(mktemp -d)" WORLD_SIM_HUMAN_SMOKE=1 timeout 120 "$engine" --headless --path godot --quit-after 6 2>&1 | tee /tmp/godot-human.log
          if grep -E '(SCRIPT ERROR|ERROR:|Unhandled exception|Exception:)' /tmp/godot-human.log; then
            echo "Godot human demography smoke failed."
            exit 1
          fi
          grep -Eq 'WORLD_SIM_HUMAN_OK: Births=[1-9][0-9]* ChildWorkers=0 Children=[1-9][0-9]* Save=1' /tmp/godot-human.log
          # V0-03B: Godot must render the injected Core map, never generate its own.
          if grep -Rq 'DemoHexWorld.Generate\|DemoWorldSites.Generate' godot/Scripts; then
            echo "Forbidden Godot-side map or site generation detected."
            exit 1
          fi
          # Terrain generation belongs to Core, never the Godot UI.
          if grep -Rq 'TerrainCode' godot/Scripts; then
            echo "Forbidden independent Godot terrain generator detected."
            exit 1
          fi
          grep -q 'RngStreams.Geography' src/WorldSimulation.Core/World/Demo/DemoHexWorld.cs
          echo "Actual Godot .NET scene loaded and ran headlessly."

      - name: Report Godot failure lines as annotations
        if: failure()
        run: |
          # 本工作階段讀不到 CI 原始日誌，失敗時把「最後寫入的日誌」關鍵行轉成註記（API 可讀）。
          f="$(ls -t /tmp/godot-*.log /tmp/observer-*.log 2>/dev/null | head -1)"
          [ -n "$f" ] || exit 0
          lines="$(grep -nE -A2 '(SCRIPT ERROR|ERROR|Unhandled exception|Exception|WORLD_SIM_|   at |失敗|FAIL|Failed |Error Message|Expected|Actual|still in use|Leaked|res://)' "$f" | grep -v 'Passed ' | head -80 | cut -c1-400)"
          [ -n "$lines" ] || lines="$(tail -30 "$f" | cut -c1-240)"
          msg="$(printf '%s' "$lines" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          echo "::error title=LAST $(basename "$f")::$msg"
          # 單元測試失敗時另列全部失敗測試名稱（上面的關鍵行只有前 80 行）。
          if [ -f /tmp/observer-tests.log ]; then
            names="$(grep -E -A3 '^\s+Failed WorldSimulation' /tmp/observer-tests.log | grep -v 'Stack Trace' | sed 's/^ *//' | cut -c1-300 | head -80)"
            [ -z "$names" ] || echo "::error title=FAILED TESTS::$(printf '%s' "$names" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
